# Aviso: el archivo de registro del generador de migraciones Alembic
[alembic]
# Ruta al directorio de migraciones
script_location = migrations

# Plantilla para generar nuevos archivos de migración
file_template = %%(rev)s_%%(slug)s

# Versión de la base de datos objetivo
version_location = migrations/versions

# Separador de delimitador de versiones
version_path_separator = os

# Codificación de salida (usa para archivos de salida)
output_encoding = utf-8

# Zona horaria para las marcas de tiempo de las migraciones
timezone = utc

# Máximo número de caracteres en el nombre de la migración
max_name_length = 50

# SQLAlchemy URL (se sobrescribe desde el código)
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Hook para ejecutar formateo de código después de escribir la migración
hooks = black

# Formateador black
black.type = console_scripts
black.entrypoint = black
black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
