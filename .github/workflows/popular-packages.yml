name: Refresh popular packages

on:
  schedule:
    # Lunes 06:00 UTC. hugovk publica el ranking de PyPI el día 1 de cada mes.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh popular package lists
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Fetch the rankings and review the newcomers
        # Un nombre nuevo que imita a un paquete que ya era popular queda en cuarentena:
        # no entra a la lista (docs/adr/0011-popular-list-newcomer-quarantine.md).
        run: uv run python scripts/fetch_popular.py --report "$RUNNER_TEMP/popular-report.md"
      - name: Publish the newcomer review
        # Visible también cuando la lista no cambia y no se abre un PR.
        run: cat "$RUNNER_TEMP/popular-report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: peter-evans/create-pull-request@v8
        with:
          # Un PR abierto con GITHUB_TOKEN no dispara la CI. Con un token propio en
          # POPULAR_PACKAGES_TOKEN (PAT o GitHub App) la CI corre sobre el PR.
          token: ${{ secrets.POPULAR_PACKAGES_TOKEN || github.token }}
          add-paths: data/popular/*.json
          branch: chore/refresh-popular-packages
          delete-branch: true
          commit-message: "chore(data): refresh popular package lists"
          title: "chore(data): refresh popular package lists"
          # El cuerpo lo escribe el script: qué revisar, quién entra y quién quedó en cuarentena.
          body-path: ${{ runner.temp }}/popular-report.md
