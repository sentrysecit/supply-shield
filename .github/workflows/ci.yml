name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run mypy

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Bandit
        run: uv run bandit -c pyproject.toml -r src
      - name: Audit locked dependencies
        run: |
          uv export --locked --no-emit-project --format requirements-txt --output-file requirements-audit.txt --quiet
          uv run pip-audit --requirement requirements-audit.txt --require-hashes --disable-pip
      - name: Gitleaks
        # Keep this tag in sync with the gitleaks rev in .pre-commit-config.yaml.
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.0
          git /repo --redact --verbose

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        # Keep in sync with the db service in docker-compose.yml.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: supply_shield
          POSTGRES_USER: supply_shield
          POSTGRES_PASSWORD: supply_shield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supply_shield -d supply_shield"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SUPPLY_SHIELD_DATABASE_URL: postgresql+asyncpg://supply_shield:supply_shield@localhost:5432/supply_shield
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Upgrade an empty database to head
        run: uv run alembic upgrade head
      - name: Models match the migrations
        run: uv run alembic check
      - name: Downgrade to base and upgrade again
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: supply-shield:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
